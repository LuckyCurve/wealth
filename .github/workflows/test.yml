name: 单元测试

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    name: 运行单元测试 (node --test · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 上限比实际耗时（<30s）宽很多，只用来兜「卡住」：某次 macOS 任务等了 15 分钟没分配到
    # runner，最后被判取消——没有上限的话这种等待会一直挂着。
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 两平台：ubuntu（POSIX 基线）+ windows（路径/换行/文件编码这些真差异都在这一侧）。
        # 2026-10-28 去掉 macOS：它与 ubuntu 同为 POSIX，node --test 是纯逻辑 + 读文件，多它一行
        # 几乎不产生新信号；而 macos runner 供给最不稳（10-27 那次排了 15 分钟没拿到机器，
        # 任务被判「取消」，看着像我们的代码红了）。
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 运行单元测试
        run: node --test

  e2e:
    name: 运行端到端测试 (Playwright · chromium)
    # 单系统足够：E2E 验证的是应用行为，与 OS 无关；三平台各装一次浏览器不值这个时长
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 系统依赖
        run: npx playwright install-deps chromium

      # 浏览器二进制缓存：约 700MB，无缓存时每次全量下载约 50s。
      # 缓存 key 带上 package-lock 的 playwright 版本，升级 playwright 时自动失效重装。
      - name: 缓存 Playwright 浏览器
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: 安装 Playwright 浏览器
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: 运行端到端测试
        run: npx playwright test

      - name: 上传失败用例的 trace / 截图
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: e2e-results/
          if-no-files-found: ignore
          retention-days: 7
